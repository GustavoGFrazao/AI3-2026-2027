<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API de Sugestões</title>
    <link rel="stylesheet" href="estilos.css">
    <script type="module" src="app.js"></script>
</head>
<body>
<main class="container">
    <header>
        <h1>API de Sugestões</h1>
        <p>Escola Superior de Tecnologia</p>
    </header>

    <section class="painel configuracoes">
        <h2>Configurações</h2>

        <div class="campo-configuracao">
            <label for="tema">Tema</label>
            <select id="tema">
                <option value="claro">Claro</option>
                <option value="escuro">Escuro</option>
            </select>
        </div>

        <div class="campo-configuracao">
            <label for="ordenacao">Ordenação das sugestões</label>
            <select id="ordenacao">
                <option value="recentes">Mais recentes</option>
                <option value="estado">Por estado</option>
            </select>
        </div>
    </section>

    <div id="mensagem" class="mensagem" role="alert" hidden></div>

    <section id="zonaLogin" class="painel">
        <h2>Iniciar sessão</h2>

        <form id="formLogin">
            <label for="utilizador">Utilizador</label>
            <input
                id="utilizador"
                name="utilizador"
                type="text"
                autocomplete="username"
                maxlength="100"
                required
            >

            <label for="palavraPasse">Palavra-passe</label>
            <input
                id="palavraPasse"
                name="palavraPasse"
                type="password"
                autocomplete="current-password"
                minlength="8"
                maxlength="128"
                required
            >

            <button type="submit">Entrar</button>
        </form>
    </section>

    <section id="zonaSessao" class="painel" hidden>
        <h2>Sessão iniciada</h2>

        <p><strong>Nome:</strong> <span id="nomeUtilizador"></span></p>
        <p><strong>Papel:</strong> <span id="papelUtilizador"></span></p>
        <p><strong>Tempo restante:</strong> <span id="contador">--:--</span></p>

        <div class="botoes">
            <button id="botaoSugestoes" type="button">
                Consultar sugestões
            </button>

            <button id="botaoLogout" class="secundario" type="button">
                Terminar sessão
            </button>
        </div>

        <section id="zonaNovaSugestao" hidden>
            <h2>Nova sugestão</h2>

            <form id="formSugestao">
                <label for="tituloSugestao">Título</label>
                <input
                    id="tituloSugestao"
                    name="titulo"
                    type="text"
                    minlength="10"
                    maxlength="120"
                    required
                >

                <label for="descricaoSugestao">Descrição</label>
                <textarea
                    id="descricaoSugestao"
                    name="descricao"
                    minlength="20"
                    maxlength="2000"
                    rows="5"
                    required
                ></textarea>

                <label for="categoriaSugestao">Categoria</label>
                <select id="categoriaSugestao" name="categoria" required>
                    <option value="">Seleciona uma categoria</option>
                    <option value="instalacoes">Instalações</option>
                    <option value="ensino">Ensino</option>
                    <option value="servicos">Serviços</option>
                    <option value="atividades">Atividades</option>
                    <option value="outra">Outra</option>
                </select>

                <button type="submit">Submeter sugestão</button>
            </form>
        </section>

        <section id="zonaSugestoes" aria-live="polite">
            <h2>Sugestões</h2>
            <p id="estadoLista">Seleciona o botão para consultar sugestões.</p>
            <div id="listaSugestoes"></div>
        </section>
    </section>

    <footer>
        <p>Projeto académico — Aplicações para a Internet III</p>
    </footer>
</main>
</body>
</html>
